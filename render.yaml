services:
  - type: web
    name: portfolio-chatbot-api
    env: docker
    rootDir: api
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://shashank17singh.github.io
      - key: PORT
        value: "5000"
    healthCheckPath: /health
